name: Worker Ingestion Heartbeat

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Emit heartbeat
        env:
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          mkdir -p heartbeat
          ts="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          {
            echo "timestamp_utc=${ts}"
            echo "repository=${REPO}"
            echo "workflow=${WORKFLOW}"
            echo "run_id=${RUN_ID}"
            echo "run_number=${RUN_NUMBER}"
            echo "event_name=${EVENT}"
            echo "sha=${SHA}"
            echo "ref=${REF}"
          } | tee heartbeat/heartbeat.txt

      - name: Upload heartbeat artifact
        uses: actions/upload-artifact@v4
        with:
          name: worker-ingestion-heartbeat-${{ github.run_id }}
          path: heartbeat/heartbeat.txt
          if-no-files-found: error
          retention-days: 14
